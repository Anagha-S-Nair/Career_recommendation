<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="needleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" />

  <!-- Compass ring (outer) -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#4338ca" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- 8-point compass star marks -->
  <!-- Cardinal points -->
  <line x1="32" y1="12" x2="32" y2="16" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="32" y1="48" x2="32" y2="52" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="12" y1="32" x2="16" y2="32" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
  <line x1="48" y1="32" x2="52" y2="32" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
  <!-- Intercardinal points -->
  <line x1="18" y1="18" x2="21" y2="21" stroke="#4f46e5" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
  <line x1="43" y1="43" x2="46" y2="46" stroke="#4f46e5" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
  <line x1="46" y1="18" x2="43" y2="21" stroke="#4f46e5" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>
  <line x1="21" y1="43" x2="18" y2="46" stroke="#4f46e5" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5"/>

  <!-- Main compass needle — diagonal upper-right (NE) — violet/white kite shape -->
  <polygon points="32,32 23,41 32,37" fill="#6366f1" fill-opacity="0.9" />
  <polygon points="32,32 41,23 37,32" fill="url(#needleGrad)" />
  <!-- Needle tail dark points -->
  <polygon points="32,32 41,41 36,34" fill="#312e81" fill-opacity="0.5" />
  <polygon points="32,32 23,23 28,30" fill="#312e81" fill-opacity="0.5" />

  <!-- Center pivot -->
  <circle cx="32" cy="32" r="3" fill="#ffffff" />
  <circle cx="32" cy="32" r="1.5" fill="#4f46e5" />
</svg>
