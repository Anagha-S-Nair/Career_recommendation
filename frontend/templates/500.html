{% extends 'base.html' %}

{% block title %}Internal Server Error (500){% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <div class="display-1 fw-bold text-warning mb-3">500</div>
        <h2 class="fw-bold mb-2">Something Went Wrong</h2>
        <p class="text-muted mx-auto mb-4" style="max-width: 500px;">
            An unexpected error occurred while processing your request. Our administrative logging system has recorded this event.
        </p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary-custom px-4 py-2">
            <i class="bi bi-house-door me-2"></i> Return to Home
        </a>
    </div>
</div>
{% endblock %}
