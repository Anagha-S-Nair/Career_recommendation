{% extends 'base.html' %}

{% block title %}Access Forbidden (403){% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <div class="display-1 fw-bold text-danger mb-3">403</div>
        <h2 class="fw-bold mb-2">Access Denied</h2>
        <p class="text-muted mx-auto mb-4" style="max-width: 500px;">
            You do not have administrative or authorization permissions to access this specific resource or record.
        </p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary-custom px-4 py-2">
            <i class="bi bi-arrow-left me-2"></i> Return Safely
        </a>
    </div>
</div>
{% endblock %}
