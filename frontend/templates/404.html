{% extends 'base.html' %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="py-5">
        <div class="display-1 fw-bold text-primary mb-3">404</div>
        <h2 class="fw-bold mb-2">Oops! Page Not Found</h2>
        <p class="text-muted mx-auto mb-4" style="max-width: 500px;">
            The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
        </p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary-custom px-4 py-2">
            <i class="bi bi-house-door me-2"></i> Return to Home
        </a>
    </div>
</div>
{% endblock %}
